name: Bug
description: Something that does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or clicks.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: What you expected to happen, and what happened instead, with any error output.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The branch or commit, and whether it was local or the shared demo.
