name: Task
description: A piece of work small enough for one pull request.
body:
  - type: textarea
    id: goal
    attributes:
      label: What and why
      description: What should change, and why it matters for the project.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How a reviewer can check the task is finished.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, open questions, or anything the person picking it up should know.
