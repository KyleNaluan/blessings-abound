name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: [self-hosted, linux, ba-ci]
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: thrift
          POSTGRES_PASSWORD: thrift
          POSTGRES_DB: thrift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thrift -d thrift"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://thrift:thrift@localhost:5432/thrift
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Migrations apply
        run: uv run alembic upgrade head
      - name: Models match the migrations
        run: uv run alembic check
      - name: Migration history has one head
        run: test "$(uv run alembic heads | wc -l)" -eq 1
      - name: Test
        run: uv run pytest

  web:
    runs-on: [self-hosted, linux, ba-ci]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: npm ci
      - name: Generated API client is up to date
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - name: Lint
        run: npm run lint && npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
