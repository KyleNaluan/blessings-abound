[project]
name = "thrift-api"
version = "0.1.0"
description = "API for Turnstone"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.33",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["app", "tests", "alembic"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
