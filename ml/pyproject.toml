[project]
name = "thrift-ml"
version = "0.1.0"
description = "Price model training for the Thrift Listing Assistant"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
